services:
  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      # Só em loopback — o nginx do host (que também atende villamill/thieco/etc.)
      # é quem expõe pra fora e cuida do TLS via Certbot.
      - "127.0.0.1:3010:3000"
    volumes:
      # Comprovantes enviados pelos alunos precisam sobreviver a rebuilds/redeploys
      # do container (senão some tudo que foi enviado desde o último build).
      - comprovantes:/app/public/comprovantes
    networks:
      - default
      # Rede compartilhada da Holding — alcança o container evolution_api
      # (evolution-api/docker-compose.yml) pelo nome, pra WhatsApp real
      # (ver src/lib/whatsapp-gateway.ts). Precisa existir antes na VPS:
      # `docker network create orbita_shared` (idempotente, já deve existir
      # já que outros produtos — orbita-cortex, lane-confeitaria — usam a
      # mesma rede).
      - orbita_shared

  # One-off: aplica migrations pendentes no banco (Supabase).
  # Não sobe sozinho com `docker compose up` — rode manualmente:
  #   docker compose run --rm migrate
  migrate:
    build:
      context: .
      target: builder
    env_file:
      - .env.production
    command: ["npx", "prisma", "migrate", "deploy"]

  # One-off: cria o usuário admin (Sandro) inicial. Rode uma vez só, após o
  # primeiro `migrate`:
  #   docker compose run --rm seed
  seed:
    build:
      context: .
      target: builder
    env_file:
      - .env.production
    command: ["npx", "tsx", "prisma/seed.ts"]

volumes:
  comprovantes:

networks:
  orbita_shared:
    external: true

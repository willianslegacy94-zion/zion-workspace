# ─────────────────────────────────────────────────────────
#  Evolution API — Gateway WhatsApp (self-hosted)
#  Usado pelo Órbita Black (orbita-black-prospeccao) para
#  conectar o número comprado no br.did ao WhatsApp via QR code.
#
#  Subir:   docker compose up -d
#  Painel:  http://localhost:8081/manager  (login com AUTHENTICATION_API_KEY)
# ─────────────────────────────────────────────────────────

services:

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: unless-stopped

    ports:
      - "8081:8080"

    environment:
      SERVER_URL: http://localhost:8081

      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY}

      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@postgres:5432/evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"

      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"

    volumes:
      - evolution_instances:/evolution/instances

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    networks:
      - evolution_net

  postgres:
    image: postgres:16-alpine
    container_name: evolution_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution

    ports:
      - "5436:5432"

    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - evolution_net

  redis:
    image: redis:alpine
    container_name: evolution_redis
    restart: unless-stopped

    volumes:
      - evolution_redis_data:/data

    networks:
      - evolution_net

volumes:
  evolution_instances:
    name: evolution_instances
  evolution_postgres_data:
    name: evolution_postgres_data
  evolution_redis_data:
    name: evolution_redis_data

networks:
  evolution_net:
    name: evolution_network
    driver: bridge

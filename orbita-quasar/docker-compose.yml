# ─────────────────────────────────────────────────────────
#  Órbita Quasar — concierge/atendimento da Holding
#  Subir: docker compose up -d --build
# ─────────────────────────────────────────────────────────
services:
  quasar:
    build: .
    container_name: orbita_quasar
    restart: unless-stopped

    # Carrega o .env compartilhado da raiz do workspace (RD-005) — mesma
    # OPENROUTER_API_KEY usada por todos os agentes da Holding.
    env_file:
      - ../.env

    environment:
      # Cortex e Evolution API rodam em outros docker-compose (fora deste) —
      # alcançados pelo nome do container na rede compartilhada
      # `orbita_shared`, não host.docker.internal (não alcança portas
      # 127.0.0.1-only do host em Linux puro/VPS).
      CORTEX_URL: http://orbita_cortex:5000
      EVOLUTION_API_URL: http://evolution_api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}

    ports:
      - "127.0.0.1:5003:5003"

    networks:
      - default
      - orbita_shared

networks:
  orbita_shared:
    external: true

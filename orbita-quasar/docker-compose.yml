# ─────────────────────────────────────────────────────────
#  Órbita Quasar — concierge/atendimento da Holding
#  Subir: docker compose up -d --build
# ─────────────────────────────────────────────────────────
services:
  quasar:
    build: .
    container_name: orbita_quasar
    restart: unless-stopped

    # Carrega o .env compartilhado da raiz do workspace (RD-005) — mesma
    # OPENROUTER_API_KEY usada por todos os agentes da Holding.
    env_file:
      - ../.env

    environment:
      # Cortex e Evolution API rodam em outros docker-compose (fora deste) —
      # alcançados pelo nome do container na rede compartilhada
      # `orbita_shared`, não host.docker.internal (não alcança portas
      # 127.0.0.1-only do host em Linux puro/VPS).
      CORTEX_URL: http://orbita_cortex:5000
      EVOLUTION_API_URL: http://evolution_api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}

      # sistema-thieco — usado só pelo tool call acionar_atendimento_humano
      # (transbordo pra um humano). Mesma rede orbita_shared, container
      # thieco_api. INTERNAL_SERVICE_KEY precisa bater com o valor
      # configurado no .env do sistema-thieco (ver middleware/auth.js,
      # authenticateInternal).
      THIECO_API_URL: http://thieco_api:3001

      # Backend compartilhado do whitelabel — mesmo Quasar atende qualquer
      # cliente que nascer ali, sem redeploy (ver _resolver_origem_cliente e
      # buscar_tenant_whitelabel em main.py, Playbook DevOps "Plano de
      # portabilidade whitelabel"). Nome do container muda conforme
      # PROJECT_NAME configurado no docker-compose do whitelabel
      # (${PROJECT_NAME:-sistema-orbita}_api).
      WHITELABEL_API_URL: ${WHITELABEL_API_URL:-http://sistema-orbita_api:3001}

      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}

      # Lane Confeitaria — sistema Next.js rodando fora de Docker (npm run
      # dev direto no host, não faz parte de orbita_shared ainda). Diferente
      # de THIECO_API_URL/WHITELABEL_API_URL, aqui o default é
      # host.docker.internal, que só funciona em Docker Desktop (Windows/Mac)
      # — se este container for pra um Linux puro/VPS antes do Lane
      # Confeitaria virar um container na rede compartilhada, sobrescrever
      # via .env deste diretório (mesmo padrão já usado por WHITELABEL_API_URL).
      LANE_CONFEITARIA_API_URL: ${LANE_CONFEITARIA_API_URL:-http://host.docker.internal:3002}
      LANE_CONFEITARIA_INTERNAL_KEY: ${LANE_CONFEITARIA_INTERNAL_KEY}

    extra_hosts:
      # Garante host.docker.internal também em Docker Engine puro (Linux) —
      # em Docker Desktop (Windows/Mac) já funciona sem isso, mas não atrapalha.
      - "host.docker.internal:host-gateway"

    ports:
      - "127.0.0.1:5003:5003"

    networks:
      - default
      - orbita_shared

networks:
  orbita_shared:
    external: true

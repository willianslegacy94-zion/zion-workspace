# ─────────────────────────────────────────────────────────
#  Órbita Cortex — cérebro analítico da Holding
#  Subir: docker compose up -d --build
# ─────────────────────────────────────────────────────────
services:
  cortex:
    build: .
    container_name: orbita_cortex
    restart: unless-stopped

    # Carrega o .env compartilhado da raiz do workspace (RD-005) — mesma
    # OPENROUTER_API_KEY usada por todos os agentes da Holding.
    env_file:
      - ../.env

    environment:
      # Evolution API e o Postgres do sistema-thieco rodam em outros
      # docker-compose (fora deste) — alcançados pelo nome do container na
      # rede compartilhada `orbita_shared`, não por host.docker.internal
      # (que não alcança portas 127.0.0.1-only do host em Linux puro/VPS).
      EVOLUTION_API_URL: http://evolution_api:8080
      THIECO_DATABASE_URL: ${THIECO_DATABASE_URL_DOCKER}

      # sistema-thieco — usado pelo webhook do canal admin (relatório sob
      # demanda). Mesma chave de servico-a-servico que o Quasar usa pro
      # transbordo, ver middleware/auth.js (authenticateInternal) no
      # sistema-thieco.
      THIECO_API_URL: http://thieco_api:3001
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}

    ports:
      - "127.0.0.1:5000:5000"

    networks:
      - default
      - orbita_shared

networks:
  orbita_shared:
    external: true
